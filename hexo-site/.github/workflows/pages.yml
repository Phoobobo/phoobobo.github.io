# GitHub Actions workflow for Hexo blog
name: Deploy Blog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install hexo-cli hexo-renderer-pug hexo-renderer-stylus
          npm install hexo-filter-nofollow hexo-generator-sitemap hexo-generator-feed hexo-abbrlink
          npm install

      - name: Generate static files
        run: |
          hexo clean
          hexo generate
        env:
          HEXO_DEPLOYER_GIT_EMAIL: ${{ secrets.HEXO_DEPLOYER_GIT_EMAIL }}
          HEXO_DEPLOYER_GIT_NAME: ${{ secrets.HEXO_DEPLOYER_GIT_NAME }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
